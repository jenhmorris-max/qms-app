<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayside QMS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: fixed left rail + scrolling work area; every list shares one grid (filters / status chip / owner / age / one action). */
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#eeebe5; --line:#dcd7cf; --line-strong:#c4beb3;
  --fg:#26231f; --fg-2:#5c564d; --fg-3:#8a8378;
  --accent:#2f6d72; --accent-soft:#dfeceb; --accent-ink:#1d4f53;
  --s-grey:#8a8378; --s-grey-bg:#ecebe7; --s-green:#2e7a4f; --s-green-bg:#dff0e4; --s-amber:#a4650e; --s-amber-bg:#fbead0; --s-red:#b03a2e; --s-red-bg:#f8dcd7; --s-black:#26231f; --s-black-bg:#d9d5ce;
  --rail:#1f2a2b; --rail-fg:#d7dcd9; --rail-muted:#8c9a97; --rail-active:#2f6d72;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1917; --surface:#242120; --surface-2:#2d2a28; --line:#3a3633; --line-strong:#4b4642;
  --fg:#ece8e2; --fg-2:#b8b1a7; --fg-3:#8a8378;
  --accent:#6fb3b8; --accent-soft:#223a3c; --accent-ink:#9fd3d6;
  --s-grey:#a39b8f; --s-grey-bg:#34312e; --s-green:#7cc598; --s-green-bg:#1f3a2a; --s-amber:#e3a95a; --s-amber-bg:#3f2f16; --s-red:#ea8a7d; --s-red-bg:#44211c; --s-black:#ece8e2; --s-black-bg:#4b4642;
  --rail:#141a1b; --rail-fg:#d7dcd9; --rail-muted:#7f8d8a; --rail-active:#2f6d72;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1b1917; --surface:#242120; --surface-2:#2d2a28; --line:#3a3633; --line-strong:#4b4642;
  --fg:#ece8e2; --fg-2:#b8b1a7; --fg-3:#8a8378;
  --accent:#6fb3b8; --accent-soft:#223a3c; --accent-ink:#9fd3d6;
  --s-grey:#a39b8f; --s-grey-bg:#34312e; --s-green:#7cc598; --s-green-bg:#1f3a2a; --s-amber:#e3a95a; --s-amber-bg:#3f2f16; --s-red:#ea8a7d; --s-red-bg:#44211c; --s-black:#ece8e2; --s-black-bg:#4b4642;
  --rail:#141a1b; --rail-fg:#d7dcd9; --rail-muted:#7f8d8a; --rail-active:#2f6d72;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 26px/1.2 var(--font-display)}
h2{font:600 18px/1.25 var(--font-display)}
h3{font:600 13px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100%;min-height:0}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;padding-block:14px;padding-left:max(0px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{padding:4px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .co{font:600 16px/1.2 var(--font-display);color:#fff}
.brand .cage{font-family:var(--font-mono);font-size:11px;color:var(--rail-muted);margin-top:2px}
.nav{list-style:none;margin:0;padding:10px 10px}
.nav li a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius);color:var(--rail-fg);text-decoration:none;font-weight:500}
.nav li a:hover{background:rgba(255,255,255,.06)}
.nav li a.active{background:var(--rail-active);color:#fff}
.nav li a .ct{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--rail-muted)}
.nav li a.active .ct{color:#dbe9ea}
.nav .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted);padding:12px 10px 4px}
.rail .spacer{flex:1}
.rail .pinned{border-top:1px solid rgba(255,255,255,.08);padding-top:6px}
.ico{width:16px;height:16px;flex:none;opacity:.8}

.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:6px 8px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--fg-3)}
.search .hint{position:absolute;right:10px;top:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.results{position:absolute;left:0;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;max-height:320px;overflow:auto}
.results a{display:flex;gap:10px;padding:8px 12px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line)}
.results a:hover{background:var(--accent-soft)}
.results .k{font-family:var(--font-mono);font-size:12px;color:var(--fg-3);min-width:88px}
.user{margin-left:auto;position:relative}
.user>button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 6px;border-radius:var(--radius);cursor:pointer}
.user>button:hover{background:var(--surface-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.user .who{text-align:left;line-height:1.2}
.user .who small{display:block;color:var(--fg-3);font-size:11px}
.umenu{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:220px;z-index:20;padding:6px}
.umenu a,.umenu span{display:block;padding:8px 10px;border-radius:4px;text-decoration:none;color:var(--fg)}
.umenu a:hover{background:var(--accent-soft)}
.umenu span{color:var(--fg-3);font-size:12px}
.umenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

main{flex:1;overflow:auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.page-head .sub{color:var(--fg-2);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--fg-3);display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--fg-3);text-decoration:none}
.crumb a:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* status chip: one semantic set */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.grey{color:var(--s-grey);background:var(--s-grey-bg)}
.chip.green{color:var(--s-green);background:var(--s-green-bg)}
.chip.amber{color:var(--s-amber);background:var(--s-amber-bg)}
.chip.red{color:var(--s-red);background:var(--s-red-bg)}
.chip.black{color:var(--s-black);background:var(--s-black-bg)}

/* clause reference key */
.ref{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid transparent;text-decoration:none;cursor:pointer;vertical-align:middle;white-space:nowrap}
.ref::before{content:"§";font-size:10px;opacity:.7}
.ref:hover{border-color:var(--accent)}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card .hd h3{margin:0}
.card .hd .more{margin-left:auto;font-size:12.5px}
.card .bd{padding:14px 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}
.filters .count{margin-left:auto;color:var(--fg-3);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:640px}
table.list th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.row:hover td{background:var(--surface-2)}
table.list td.act{text-align:right;white-space:nowrap}
table.list td .t{font-weight:500}
table.list td .t a{color:inherit;text-decoration:none}
table.list td .t a:hover{text-decoration:underline}
table.list td .d{color:var(--fg-3);font-size:12.5px}
td.age{font-variant-numeric:tabular-nums;white-space:nowrap}
.age.hot{color:var(--s-red);font-weight:600}
.age.warm{color:var(--s-amber);font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0}
.two{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.two>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

/* dashboard tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-auto-rows:minmax(150px,auto)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.tile.wide{grid-column:span 2}.tile.tall{grid-row:span 2}
.tile .th{display:flex;align-items:center;gap:8px}
.tile .th h3{margin:0}
.tile .th .drag{margin-left:auto;cursor:grab;color:var(--fg-3);font-size:14px;opacity:0}
.tiles.editing .tile .th .drag{opacity:1}
.tiles.editing .tile{outline:1px dashed var(--accent);cursor:grab}
.tile.dragover{outline:2px solid var(--accent)}
.tile .big{font:600 44px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .big small{font:500 13px/1 var(--font-body);color:var(--fg-3);margin-left:6px}
.tile .foot{margin-top:auto;font-size:12.5px;color:var(--fg-3)}
.tile.empty{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--fg-3);cursor:pointer}
.tile.empty:hover{background:var(--surface)}
.dates{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.dates li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.dates li:first-child{border-top:0}
.dates .dt{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2);line-height:1.2}
.dates .dt b{display:block;font-size:14px;color:var(--fg)}
.dates .what a{color:inherit;text-decoration:none}
.dates .what a:hover{text-decoration:underline}
.dates .what small{display:block;color:var(--fg-3)}
.q li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.q{list-style:none;margin:0;padding:0}
.q li:first-child{border-top:0}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font:600 24px/1 var(--font-display);font-variant-numeric:tabular-nums}
.spark{width:100%;height:70px}
.tilepicker{display:flex;flex-wrap:wrap;gap:8px}
.tilepicker label{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface)}

/* value stream */
.stream{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stream li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.stream li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.stream li:last-child::before{display:none}
.stream .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--fg-3)}
.stream li.done .dot{background:var(--s-green);border-color:var(--s-green);color:#fff}
.stream li.now .dot{background:var(--s-amber);border-color:var(--s-amber);color:#fff}
.stream li.blocked .dot{background:var(--surface);border-color:var(--s-red);color:var(--s-red)}
.stream .st{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stream .st b{font-weight:600}
.stream .st .when{color:var(--fg-3);font-size:12.5px}
.stream .body{color:var(--fg-2);margin-top:4px;font-size:13.5px}
.stream .body p{margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--fg-2)}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}
.form textarea{min-height:70px;resize:vertical}

/* document */
.docpage{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.docpage>*{min-width:0}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 36px;font-size:14.5px;line-height:1.65}
.paper .dochead{display:grid;grid-template-columns:1fr auto;gap:8px 18px;border-bottom:2px solid var(--fg);padding-bottom:12px;margin-bottom:18px}
.paper .dochead h1{font-size:24px}
.paper .dochead .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2);text-align:right;line-height:1.5}
.paper h2{font-size:15px;font-family:var(--font-body);font-weight:600;margin:20px 0 6px;display:flex;gap:10px;align-items:center}
.paper p{margin:0 0 10px;max-width:68ch}
.paper ol{padding-left:22px;max-width:68ch}
.paper li{margin-bottom:4px}
.stamp{border:2px solid var(--s-green);color:var(--s-green);border-radius:4px;padding:8px 12px;display:inline-block;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;transform:rotate(-1.5deg);background:var(--s-green-bg)}
.stamp b{display:block;font-size:13px;letter-spacing:.08em}
.revs{list-style:none;margin:0;padding:0}
.revs li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.revs li:first-child{border-top:0}
.revs .r{font-family:var(--font-mono);font-weight:500}
.revs small{display:block;color:var(--fg-3)}
.uncontrolled{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:center;margin-top:24px;border-top:1px dashed var(--line);padding-top:10px}

/* clause page */
.clause-h{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline}
.clause-h .n{font:600 40px/1 var(--font-display);color:var(--accent-ink)}
.layer{border-left:3px solid var(--line-strong);padding:4px 0 4px 16px}
.layer.why{border-color:var(--accent)}
.layer.tip{border-color:var(--s-amber);background:var(--s-amber-bg);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0}
.layer h3{margin-bottom:6px}
.layer p{margin:0 0 8px;max-width:70ch}
.evlist{list-style:none;margin:0;padding:0}
.evlist li{display:grid;grid-template-columns:70px 1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.evlist li:first-child{border-top:0}
.evlist .k{font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}
.evlist a{color:inherit;text-decoration:none}
.evlist a:hover{text-decoration:underline}
.clausegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:inherit}
.cl:hover{border-color:var(--accent)}
.cl .n{font-family:var(--font-mono);font-weight:500;color:var(--accent-ink);min-width:44px}
.cl .c{font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}
.cl .c.zero{color:var(--s-red)}
.secttl{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.secttl .cnt{font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}

/* auditor banner */
.banner{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;border-radius:var(--radius);background:var(--s-amber-bg);color:var(--s-amber);border:1px solid color-mix(in srgb,var(--s-amber) 35%,transparent);font-size:13px}
.banner b{font-weight:600}
.banner .mono{margin-left:auto;color:inherit}

/* certificate wall */
.wall{position:fixed;inset:0;background:#15201f;color:#e7ece9;z-index:50;display:none;flex-direction:column;padding-block:max(28px,env(safe-area-inset-top,0px)) 28px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));gap:22px;overflow:auto;font-family:var(--font-body)}
.wall.open{display:flex}
.wall .wh{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.wall .wh h1{font-size:30px;color:#fff}
.wall .wh .sub{color:#8fa39f}
.wall .wh .close{margin-left:auto;background:transparent;border:1px solid #3c4d4b;color:#cfd8d6;border-radius:6px;padding:8px 14px;cursor:pointer}
.wall .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1}
.wpanel{background:#1d2b2a;border:1px solid #2e3f3d;border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.wpanel.span2{grid-column:span 2}
.wpanel h3{color:#8fa39f;font-size:12px}
.wpanel .giant{font:600 clamp(56px,9vw,120px)/1 var(--font-display);color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wpanel .giant small{font:500 16px var(--font-body);color:#8fa39f;margin-left:10px}
.wpanel .lbl{color:#b9c6c3;font-size:14px}
.wpanel .good{color:#7cc598}.wpanel .warn{color:#e3a95a}.wpanel .bad{color:#ea8a7d}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bars .b{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:13px;color:#cfd8d6}
.bars .b .t{height:12px;background:#2e3f3d;border-radius:3px;overflow:hidden}

.bars .b .v{font-family:var(--font-mono);font-size:12px;text-align:right;color:#8fa39f}
.agebar{display:flex;height:26px;border-radius:5px;overflow:hidden;margin-top:6px}
.agebar i{display:grid;place-items:center;font-size:12px;color:#15201f;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#b9c6c3}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.wall .ft{color:#5f7370;font-size:12px;font-family:var(--font-mono)}

.badge{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:60;font-family:var(--font-mono);font-size:11px;background:var(--s-amber);color:#1b1917;padding:4px 10px;border-radius:999px;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.note{font-size:12.5px;color:var(--fg-3)}
.toast{position:fixed;left:50%;bottom:max(56px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.help-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.help-grid .card .bd p{margin:0 0 6px;color:var(--fg-2);font-size:13px}
.help-grid .card .bd a{display:block;font-size:13px;text-decoration:none;padding:2px 0}

@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

@media (max-width: 960px){
  .tiles{grid-template-columns:repeat(2,1fr)}

  .wall .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 760px){
  .app{grid-template-columns:1fr}

const CLAUSES = {
 '4.1':{t:'Understanding the organization and its context',para:'Work out the internal and external issues that affect whether the QMS can deliver what the customer and the standard expect, and keep that view current.',why:'A QMS designed without looking at the shop\'s real situation (customers, workforce, supply base, regulation) controls the wrong risks. This clause forces the look.',tip:'Auditors ask "show me where you reviewed context" and expect a dated record, usually in management review minutes, not a one-time slide.'},
 '4.4':{t:'QMS and its processes',para:'Define the processes the QMS needs, how they interact, who owns them, what they need and produce, and how each is measured.',why:'If nobody can draw how work flows from quote to ship, nobody can say where it fails. The process map is the skeleton every procedure hangs on.',tip:'Auditors pick a process from the interaction map and ask the named owner to explain its inputs, outputs and KPI. The owner, not the quality manager, has to answer.'},
 '5.2':{t:'Quality policy',para:'Top management sets a quality policy that fits the business, commits to meeting requirements and improving, and makes sure people understand it.',why:'The policy is the one sentence the owner signs. Everything else is supposed to trace back to it.',tip:'Auditors ask a machinist on the floor what the quality policy means for their job. "It\'s on the wall" is a weak answer; "I check every first piece against the drawing" is a strong one.'},
 '6.1':{t:'Actions to address risks and opportunities',para:'Identify what could stop the QMS from working or the product from conforming, decide what to do about it, and check later whether it worked.',why:'AS9100 replaced preventive action with risk thinking. The register is where the shop proves it looked ahead instead of only reacting.',tip:'Auditors ask for the risk register by name and then ask for one risk whose mitigation was reviewed and updated. A register with no changes since certification is a finding waiting to happen.'},
 '6.2':{t:'Quality objectives and planning',para:'Set measurable quality objectives at relevant functions, with who, what, when and how results are evaluated.',why:'Objectives without numbers cannot be met or missed, so they cannot drive anything.',tip:'An objective with no trend data behind it is a classic minor. Each objective should point at a KPI that is actually plotted.'},
 '7.1.5':{t:'Monitoring and measuring resources',para:'Equipment used to verify product must be suitable, calibrated or verified against traceable standards at set intervals, identified, protected from adjustment and damage, and its calibration status known.',why:'A measurement is only as trustworthy as the gauge behind it. An out-of-calibration micrometer can pass bad parts for months without anyone noticing.',tip:'The auditor will pick a gauge off a machinist\'s bench and ask to see its record. The sticker on the gauge and the entry in the system must match, and a gauge past due must be physically segregated.'},
 '7.2':{t:'Competence',para:'Decide what competence each role needs, make sure people have it through education, training or experience, keep evidence, and act when there is a gap.',why:'Competence is the evidence that the right people did the work. Without it, every inspection result is just a signature.',tip:'Auditors trace from a job traveller to the operator who stamped it to that operator\'s training record. The chain has to be unbroken, including for the person who ran the CMM.'},
 '7.5':{t:'Documented information',para:'Create, update and control the documents and records the QMS needs: identification, format, review, approval, distribution, access, change control, retention and protection from loss.',why:'Document control is how a shop proves that the floor is working to the current drawing and the current procedure, not last year\'s.',tip:'Auditors look for an obsolete revision still in use on the floor, and for a record that cannot be found within a few minutes. The master document list and the obsolete archive are the two things to have ready.'},
 '8.1.2':{t:'Configuration management',para:'Plan and control the configuration of product: identification, change control, status accounting and verification, so that what is built matches what was ordered.',why:'The customer must get the revision they ordered. A traveller pointing at a superseded drawing is the fastest route to an escape.',tip:'Auditors compare the drawing on the floor to the revision on the purchase order and then to the FAI. Any mismatch is a finding.'},
 '8.1.4':{t:'Prevention of counterfeit parts',para:'Plan, implement and control processes that prevent counterfeit or suspect counterfeit parts from being used or delivered.',why:'Counterfeit material in aerospace is a safety and liability issue, not only a quality one. The shop is responsible for its supply chain all the way to the mill.',tip:'Auditors ask "how would you know?" and expect a procedure with evidence of use, even if no counterfeit has ever been found: source classification on suppliers and a cert check at receiving.'},
 '8.2':{t:'Requirements for products and services',para:'Communicate with customers, determine the full requirements for what is ordered (including statutory, special and flow-down requirements), and review them before committing.',why:'Most escapes start at contract review: a note on the PO nobody read, a spec revision nobody checked.',tip:'Auditors pick a recent order and ask for the contract review record and the customer-specific requirements that applied.'},
 '8.4':{t:'Control of externally provided processes, products and services',para:'Make sure suppliers deliver what is required: select and evaluate them against criteria, monitor their performance, flow down requirements, and verify what they deliver.',why:'The shop is responsible for its suppliers\' conformity. A Nadcap-expired plater is the shop\'s finding, not the plater\'s.',tip:'Expired certificates and missing re-evaluations are the most common findings in this clause. Auditors cross-check the approved supplier list against the POs issued last month.'},
 '8.5.1':{t:'Control of production and service provision',para:'Carry out production under controlled conditions: documented work instructions, suitable equipment, monitoring at the right points, qualified people, FOD prevention, and validation of processes whose output cannot be fully verified.',why:'This is the clause that covers the actual making of parts. Everything else exists so this one works.',tip:'Auditors walk the floor. A FOD program on paper with no checklist records is a finding; so is a work instruction at the machine that does not match the controlled copy.'},
 '8.5.1.3':{t:'Production process verification (first article)',para:'Verify that the production process, documentation and tooling can produce parts that meet requirements, with a first article inspection per AS9102 and re-verification when things change.',why:'FAI proves the process, not just the part. One good part by luck is not evidence.',tip:'Auditors pick a current job and ask for its FAI. A revision mismatch between the FAI and the traveller is a classic finding.'},
 '8.7':{t:'Control of nonconforming outputs',para:'Identify and control product that does not conform so it is not used or delivered unintentionally: contain it, decide its disposition (rework, repair, scrap, use-as-is with authority), notify the customer where required, and keep records.',why:'Nonconforming product that escapes is the failure every other control exists to prevent. The NCR record is also where root-cause analysis starts.',tip:'Auditors look at the quarantine shelf and ask for the NCR on each tag. They also check that use-as-is and repair dispositions had customer authority where the contract requires it.'},
 '9.1':{t:'Monitoring, measurement, analysis and evaluation',para:'Decide what to measure, how, and when; analyse the results to evaluate performance and the effectiveness of the QMS.',why:'Measurement proves the system works. Objectives without data are findings waiting to happen.',tip:'Auditors look for a KPI that is red and ask what was done about it. Red with action is fine; green with no data is not.'},
 '9.1.2':{t:'Customer satisfaction',para:'Monitor how customers perceive the shop, including delivery, quality, complaints and scorecards, and act on what is learned.',why:'The standard requires monitoring perception, not only counting defects. A customer can be unhappy with a 100% conforming supplier.',tip:'Auditors expect evidence that feedback was reviewed and acted on, not just collected. A survey folder with no follow-up is an OFI at best.'},
 '9.2':{t:'Internal audit',para:'Audit the QMS at planned intervals to confirm it meets requirements and is effectively implemented, with impartial auditors and results reported to management.',why:'The internal audit is the shop\'s own chance to find problems before the registrar does.',tip:'Auditors check that the schedule covers every clause and every process over the cycle, and that findings were actually closed with evidence.'},
 '9.3':{t:'Management review',para:'Top management reviews the QMS at planned intervals against defined inputs (performance, audit results, customer feedback, risks, resources) and records decisions and actions.',why:'This is where the owner is shown the data and has to decide something. Without it the QMS runs without leadership.',tip:'Auditors read the minutes against the required inputs list and look for actions with owners and dates. A review that is only a slideshow is a minor.'},
 '10.2':{t:'Nonconformity and corrective action',para:'When something goes wrong, react, evaluate the need to remove the cause, implement the action, review its effectiveness, and update risks and the QMS as needed.',why:'Corrective action is the difference between fixing the part and fixing the problem. Repeat NCRs on the same cause are the signal auditors look for.',tip:'Auditors pick a closed CAR and ask for the effectiveness evidence. "No recurrence" needs a date and a data point, not an opinion.'},
 '10.3':{t:'Continual improvement',para:'Keep improving the suitability, adequacy and effectiveness of the QMS, using the results of analysis and management review.',why:'A QMS that only reacts to findings never gets ahead of them.',tip:'Auditors ask for one improvement that did not start from a nonconformance. An improvement log with a couple of Lean projects answers this cleanly.'}

function head(title,sub,crumbs,actions){
  return `<div class="page-head"><div>${crumbs?`<div class="crumb">${crumbs.map(([h,t])=>h?`<a href="${h}">${t}</a>`:`<span>${t}</span>`).join('<span>›</span>')}</div>`:''}<h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
}
function filters(opts,count){ return `<div class="filters">${opts.map(o=>Array.isArray(o)?`<select aria-label="${o[0]}"><option>${o[0]}: all</option>${o.slice(1).map(x=>`<option>${x}</option>`).join('')}</select>`:`<input type="search" placeholder="${o}">`).join('')}<span class="count">${count}</span></div>`; }
function list(cols,rows){ return `<div class="card"><div class="tbl-wrap"><table class="list"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`; }
const act = (label,href) => `<td class="act">${href?`<a class="btn sm" href="${href}">${label}</a>`:`<button class="btn sm" onclick="toast('${label}: prototype only')">${label}</button>`}</td>`;
function sparkline(vals,w=260,h=70,color='var(--accent)'){
  const min=Math.min(...vals),max=Math.max(...vals),r=(max-min)||1;
  const pts=vals.map((v,i)=>[6+i*(w-12)/(vals.length-1),h-8-((v-min)/r)*(h-18)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]} ${h-4} L6 ${h-4} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/></svg>`;
}

const DEFAULT_TILES=['dates','trend','report','approvals','overdue','cal','training','readiness','nextaudit'];
let tiles=null;
function loadTiles(){ try{ const s=JSON.parse(localStorage.getItem('qms.tiles')); if(Array.isArray(s)&&s.every(k=>TILE_DEFS[k])) return s; }catch(e){} return DEFAULT_TILES.slice(); }
function saveTiles(){ try{ localStorage.setItem('qms.tiles',JSON.stringify(tiles)); }catch(e){} }
let editing=false;
function renderDashboard(){
  tiles = tiles||loadTiles();
  const grid = tiles.map(k=>{ const t=TILE_DEFS[k]; return `<section class="tile ${t.size}" draggable="${editing}" data-tile="${k}"><div class="th"><h3>${t.title}</h3><span class="drag" title="Drag to move">⋮⋮</span></div>${t.render()}</section>`; }).join('');
  const empties = Math.max(0, 12 - tiles.reduce((n,k)=> n + (TILE_DEFS[k].size.includes('wide')?2:1)*(TILE_DEFS[k].size.includes('tall')?2:1),0) % 4 || 0);
  const empty = `<section class="tile empty" onclick="toggleEdit(true)">+ Add a tile</section>`;
  const picker = editing?`<div class="card"><div class="bd"><div class="tilepicker">${Object.keys(TILE_DEFS).map(k=>`<label><input type="checkbox" id="tp-${k}" ${tiles.includes(k)?'checked':''} onchange="toggleTile('${k}',this.checked)"> ${TILE_DEFS[k].title}</label>`).join('')}</div><p class="note" style="margin:10px 0 0">Drag tiles to reorder. Layout is remembered in this browser only. <button class="btn sm" onclick="tiles=DEFAULT_TILES.slice();saveTiles();renderDashboard()">Reset to defaults</button></p></div></div>`:'';
  return `${head('Dashboard',`Wednesday, October 28, 2026 · ${daysFrom(NEXT_AUDIT)} days to the Orion surveillance audit`,null,
    `<button class="btn" onclick="toast('Raise a quality event: prototype only')">+ Quality event</button><button class="btn" onclick="toast('Log calibration: prototype only')">+ Calibration</button><button class="btn ${editing?'primary':''}" onclick="toggleEdit()">${editing?'Done':'Customise tiles'}</button>`)}
    ${picker}<div class="tiles ${editing?'editing':''}" id="tiles">${grid}${empty}</div>`;
}
function toggleEdit(on){ editing = on===undefined?!editing:on; route(); }
function toggleTile(k,on){ if(on&&!tiles.includes(k)) tiles.push(k); if(!on) tiles=tiles.filter(x=>x!==k); saveTiles(); route(); }
function wireDrag(){
  const g=document.getElementById('tiles'); if(!g) return; let src=null;
  g.querySelectorAll('.tile[data-tile]').forEach(el=>{
    el.addEventListener('dragstart',e=>{src=el.dataset.tile; e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragover',e=>{ if(!editing) return; e.preventDefault(); el.classList.add('dragover');});
    el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('dragover'); const dst=el.dataset.tile; if(!src||src===dst) return; const a=tiles.indexOf(src),b=tiles.indexOf(dst); tiles.splice(a,1); tiles.splice(b,0,src); saveTiles(); route(); });
  });
}

   <h2>3. Identification and containment ${ref('8.7')}</h2><ol><li>Anyone who finds a suspect part stops work on that part and attaches a red NONCONFORMING tag, or records it through floor capture.</li><li>The finder or supervisor moves the product to a quarantine location (shelf Q-1, Q-2 or the receiving cage) within the same shift.</li><li>The lot is bounded: the Production Supervisor checks every other piece from the same operation and records the result on the event.</li></ol>

/* ============ CLAUSE LIBRARY ============ */
function evidenceFor(c){
  const ev=[];
  DOCS.filter(d=>d.clauses.includes(c)).forEach(d=>ev.push(['Document',d.id,d.title,d.status,'#doc-'+d.id.replace(/\./g,'-')]));
  EVENTS.filter(e=>(e.steps||[]).some(s=>s.c===c)||(c==='8.7'&&['Internal','Customer','Receiving','Supplier'].includes(e.origin))||(c==='10.2'&&['CAR Open','Verifying','Closed'].includes(e.status))).forEach(e=>ev.push(['Event',e.id,e.title,e.status,'#event-'+e.id]));
  FINDINGS.filter(f=>f.clause===c).forEach(f=>ev.push(['Finding',f.id,f.text,f.status,'#audits']));
  if(c==='7.1.5') GAUGES.slice(0,6).forEach(g=>ev.push(['Calibration',g.id,g.type+' · '+g.loc,g.status,'#calibration']));
  if(c==='7.2'||c==='7.3') PEOPLE.slice(0,5).forEach(p=>ev.push(['Training',p.n,p.role,'Qualified','#training']));
  if(c==='8.4'||c==='8.1.4') SUPPLIERS.slice(0,7).forEach(s=>ev.push(['Supplier',s.n,s.cat,s.status,'#suppliers']));
  if(c==='9.1.2') CUSTOMERS.forEach(s=>ev.push(['Survey',s.n,'Q3 survey '+s.surveys,'Complete','#customers']));
  if(c==='9.2') AUDITS.forEach(a=>ev.push(['Audit',a.id,a.scope,a.status,'#audits']));

}

/* ============ SEARCH ============ */
function search(q){
  q=q.trim().toLowerCase(); const r=document.getElementById('results'); if(!q){r.hidden=true;return;}
  const hits=[];
  Object.keys(CLAUSES).concat(Object.keys(CLAUSE_TITLES)).forEach(c=>{ if(c.startsWith(q)||((CLAUSES[c]||{}).t||CLAUSE_TITLES[c]||'').toLowerCase().includes(q)) hits.push(['Clause '+c,(CLAUSES[c]||{}).t||CLAUSE_TITLES[c],'#clause-'+c.replace(/\./g,'-')]); });
  EVENTS.forEach(e=>{ if((e.id+' '+e.title+' '+e.part+' '+e.job+' ncr').toLowerCase().includes(q)) hits.push([e.id,e.title,'#event-'+e.id]); });
  DOCS.forEach(d=>{ if((d.id+' '+d.title).toLowerCase().includes(q)) hits.push([d.id,d.title,'#doc-'+d.id.replace(/\./g,'-')]); });
  SUPPLIERS.forEach(s=>{ if(s.n.toLowerCase().includes(q)) hits.push(['Supplier',s.n,'#suppliers']); });
  GAUGES.forEach(g=>{ if((g.id+' '+g.type).toLowerCase().includes(q)) hits.push([g.id,g.type,'#calibration']); });
  PEOPLE.forEach(p=>{ if(p.n.toLowerCase().includes(q)) hits.push(['Person',p.n+' · '+p.role,'#training']); });
  REPORTS.forEach(x=>{ if(x.n.toLowerCase().includes(q)) hits.push(['Report',x.n,'#reporting']); });
  r.innerHTML = hits.length? hits.slice(0,12).map(h=>`<a href="${h[2]}"><span class="k">${esc(h[0])}</span><span>${esc(h[1])}</span></a>`).join('') : `<a href="#help"><span class="k">—</span><span>No matches. Try a clause number like 8.7, or an ID like QE-26-041.</span></a>`;
  r.hidden=false;
}

/* ============ ROUTER ============ */
const PAGES={dashboard:renderDashboard,events:renderEvents,documents:renderDocuments,audits:renderAudits,suppliers:renderSuppliers,calibration:renderCalibration,training:renderTraining,customers:renderCustomers,risk:renderRisk,processes:renderProcesses,reporting:renderReporting,analytics:renderAnalytics,fai:renderFAI,configuration:renderConfiguration,special:renderSpecial,fod:renderFOD,auditor:renderAuditor,help:renderHelp,'org-settings':renderSettings,archive:renderArchive};
function route(){
  const h=(location.hash||'#dashboard').slice(1);
  document.getElementById('wall').classList.remove('open');
  document.getElementById('rail').classList.remove('open');
  document.getElementById('umenu').hidden=true; document.getElementById('results').hidden=true;
  let html='', nav=h;
  if(h==='wall'){ renderWall(); return; }
  else if(h.startsWith('event-')){ html=renderEvent(h.slice(6)); nav='events'; }
  else if(h.startsWith('doc-')){ html=renderDoc(h.slice(4)); nav='documents'; }
  else if(h.startsWith('clause-')){ html=renderClause(h.slice(7).replace(/-/g,'.')); nav='auditor'; }
  else if(PAGES[h]) html=PAGES[h]();
  else { html=renderDashboard(); nav='dashboard'; }
  if(h!=='dashboard'&&!h.startsWith('event-')&&!h.startsWith('doc-')&&!h.startsWith('clause-')&&PAGES[h]) editing=false;
  document.getElementById('main').innerHTML=`<div class="page">${html}</div>`;
  document.getElementById('main').scrollTop=0;
  setActive(nav); wireDrag();
}
buildNav();
window.addEventListener('hashchange',route);
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('rail').classList.toggle('open'));
document.getElementById('userBtn').addEventListener('click',e=>{e.stopPropagation(); const m=document.getElementById('umenu'); m.hidden=!m.hidden;});
document.addEventListener('click',e=>{ if(!e.target.closest('.user')) document.getElementById('umenu').hidden=true; if(!e.target.closest('.search')) document.getElementById('results').hidden=true; });
document.getElementById('q').addEventListener('input',e=>search(e.target.value));
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const a=document.querySelector('#results a'); if(a){ location.hash=a.getAttribute('href'); e.target.value=''; } } });
route();
</script>
